plugins {
    id "java"
    id "org.springframework.boot" version "$springBootVersion"
    id "io.spring.dependency-management" version "$dependencyManagementVersion"
    id "groovy"
}

group = "az.ingress"
sourceCompatibility = "17"

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    //spring
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    //lombok
    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"

    //swagger
    implementation "org.springdoc:springdoc-openapi-ui:$openApiVersion"

    implementation 'org.springframework.boot:spring-boot-starter-amqp'


    implementation 'org.apache.poi:poi:5.2.2'
    implementation 'org.apache.poi:poi-ooxml:5.2.2'

    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    implementation 'org.mapstruct:mapstruct:1.6.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.0'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.8.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.8.0'

    implementation 'org.liquibase:liquibase-core:4.23.2'


    //testing
    testImplementation "org.apache.groovy:groovy:$groovyVersion"
    testImplementation "io.github.benas:random-beans:$randomBeansVersion"
    testImplementation "org.spockframework:spock-spring:$spockSpringVersion"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    runtimeOnly 'org.postgresql:postgresql'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2021.0.8"
    }
}

test {
    useJUnitPlatform()
}