databaseChangeLog:
  - changeSet:
      id: order_entity_create
      author: aladdin
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: order_number
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: total_amount
                  type: DECIMAL(19,2)
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: reservation_id
                  type: VARCHAR(255)
              - column:
                  name: reservation_expire_at
                  type: TIMESTAMP
              - column:
                  name: errorReason
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: payment_info_id
                  type: BIGINT
              - column:
                  name: shipping_address_id
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: payment_info_id
            referencedTableName: payment_info
            referencedColumnNames: id
            constraintName: fk_orders_payment_info

        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: shipping_address_id
            referencedTableName: shipping_addresses
            referencedColumnNames: id
            constraintName: fk_orders_shipping_address
