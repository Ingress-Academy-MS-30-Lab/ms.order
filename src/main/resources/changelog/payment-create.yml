databaseChangeLog:
  - changeSet:
      id: payment_info_entity_create
      author: aladdin
      changes:
        - createTable:
            tableName: payment_info
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: amount
                  type: DECIMAL(19,2)
              - column:
                  name: currency
                  type: VARCHAR(10)
              - column:
                  name: payment_method
                  type: VARCHAR(50)
              - column:
                  name: card_holder_name
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: payment_success
                  type: BOOLEAN
              - column:
                  name: reason
                  type: VARCHAR(255)
